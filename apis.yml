name: Celerion (H.I.G. Capital)
description: 'Celerion is a global contract research organization (CRO) specializing
  in early-stage clinical research, Phase I clinical trials, clinical pharmacology,
  and bioanalytical services that accelerate drug development from first-in-human
  studies through proof-of-concept. Headquartered in Lincoln, Nebraska with clinical
  and bioanalytical sites across North America and Europe, Celerion supports
  pharmaceutical and biotechnology sponsors with healthy-volunteer and special-population
  studies, bioanalysis, biomarker assays, ECG/cardiac safety, and its LabNotes
  bioanalytical data-management software. The company is a portfolio holding of
  H.I.G. Capital and was surfaced to the API Evangelist network via the
  bain-capital-ventures portfolio graph. As a corporate/marketing web presence with
  no public developer or API program, this profile carries only the artifacts that
  could be observed on the public web (llms.txt, domain-security posture).'
